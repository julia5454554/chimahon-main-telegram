name: Build Chimahon CI

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Chimahon Release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.0.12077973" "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      # NOVO: o submodulo hoshidicts nao vem no zip/repo, entao clonamos aqui.
      # Se o repositorio for privado, crie o secret GH_PAT com um token.
      - name: Fetch hoshidicts
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # O submodulo utf8proc usa URL SSH (git@github.com:); troca por HTTPS
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          DIR=chimahon/src/main/cpp/hoshidicts
          if [ ! -f "$DIR/CMakeLists.txt" ]; then
            rm -rf "$DIR"
            URL=https://github.com/Chimahon/hoshidicts
            if [ -n "$GH_PAT" ]; then URL=https://$GH_PAT@github.com/Chimahon/hoshidicts; fi
            git clone --depth 1 --recursive --branch main "$URL" "$DIR"
          fi
          ls "$DIR" | head

      # NOVO: RapidJSON, Lexbor, HarfBuzz, FreeType... (pasta ignorada pelo git)
      - name: Cache native dictionary dependencies
        uses: actions/cache@v4
        with:
          path: tools/native-dictionary/.deps
          key: native-dictionary-deps-${{ hashFiles('scripts/fetch-native-dictionary-deps.sh') }}

      - name: Fetch native dictionary dependencies
        run: bash scripts/fetch-native-dictionary-deps.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean CMake cache
        run: rm -rf app/.cxx chimahon/.cxx chimahon-local-ocr/.cxx

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chimahon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
